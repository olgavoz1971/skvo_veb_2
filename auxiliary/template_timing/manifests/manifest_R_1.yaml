# Working manifest for all meaningful ground-based observations in R filter

version: 1

global:
  lc_path: ../data/R_detrended_corrected.dat
  manifest_time:
    scale: jd_offset
    zero: 2400000
  intervals_time:
    scale: jd_offset
    zero: 2400000
  photometry_domain: mag

  template_fold:
    default_epoch: 59866.41
    default_period: 0.05937839
    period_slope: 0.0

  timing:
    method: nls_clean
    error_model: rms_slope

  output:
    run_dir: ../data/runs/ground_R_1

  plots:
    save_interval_plots: true
    save_overview: true
    overview_t_min: null
    overview_t_max: null

gp_template_defaults:
  extended_fold: true
  extrema_mode: max
  kernel_type: matern
  length_scale_init: 0.02
  length_scale_min: 0.01
  length_scale_max: 0.026
  amplitude_init: 0.3
  amplitude_min: 0.1
  amplitude_max: 0.7
  guess_sigma: false
  noise_scale_divisor: 1.0
  n_grid: 2000
  n_restarts: 3
  # Peak search: local extrema of the GP mean inside the folded data range only,
  # ranked by prominence relative to the in-range peak-to-peak amplitude.
  peak_edge_margin_frac_period: 0.05
  peak_min_separation_frac_period: 0.15
  peak_min_prominence_frac: 0.25
  peak_duplicate_phase_tol: 0.05
  peak_select: dominant
  peak_tau_hint: null

fit_defaults:
  # Which part of the cycle Step 2 fits, around the timed peak.
  # whole_period = +-0.5 P; frac_period = +-fit_mask_half_width_phase * P (max 0.5).
  fit_mask_mode: whole_period   # frac_period 
  fit_mask_half_width_phase: 0.25
  delta_tau_margin: 0.003
  delta_tau_max: 0.02
  outlier_mad_k: 3.0
  outlier_max_iter: 8
  outlier_min_inliers: 8
  scale_min: 0.5
  scale_max: 1.5

pieces:
  - piece_id: "early_sparse"
    timing_mode: segment_anchor
    # timing_mode: per_interval   # segment_anchor
    anchor_epoch: window_centre
    # Reuse template from a prior per-interval run (skip Step 1):
    existing_template_dir: ../data/runs/ground_R/pieces/early
    # Or omit existing_template_dir and set template_window to rebuild Step 1:
    # template_window:
    #   t_min: 59853.0
    #   t_max: 59858.203804
    fit_window:
      t_min: 59853.0
      t_max: 59858.203804
    local_epoch: 59866.380310805
    local_period: 0.05937839

