# Working manifest for all meaningful ground-based observations in R filter

version: 1

global:
  lc_path: ../data/R_TESS_detrended_sorted.dat
  mag0: 10

  template_fold:
    default_epoch: 59863.9936
    default_period: 0.05937839
    period_slope: 0.0

  timing:
    method: nls_clean
    error_model: rms_slope

  output:
    run_dir: ../data/runs/R_TESS

  plots:
    save_interval_plots: true
    save_overview: true
    overview_t_min: null
    overview_t_max: null

gp_template_defaults:
  extended_fold: true
  extrema_mode: max
  kernel_type: matern
  length_scale_init: 0.02
  length_scale_min: 0.01
  length_scale_max: 0.026
  amplitude_init: 0.3
  amplitude_min: 0.1
  amplitude_max: 0.7
  guess_sigma: true
  noise_scale_divisor: 1.25
  n_grid: 2000
  n_restarts: 3
  # Peak search: local extrema of the GP mean inside the folded data range only,
  # ranked by prominence relative to the in-range peak-to-peak amplitude.
  peak_edge_margin_frac_period: 0.05
  peak_min_separation_frac_period: 0.15
  peak_min_prominence_frac: 0.25
  peak_duplicate_phase_tol: 0.05
  peak_select: dominant
  peak_tau_hint: null

fit_defaults:
  # Which part of the cycle Step 2 fits, around the timed peak.
  # whole_period = +-0.5 P; frac_period = +-fit_mask_half_width_phase * P (max 0.5).
  fit_mask_mode: whole_period   # frac_period 
  fit_mask_half_width_phase: 0.25
  delta_tau_margin: 0.003
  delta_tau_max: 0.02
  outlier_mad_k: 3.0
  outlier_max_iter: 8
  outlier_min_inliers: 8
  scale_min: 0.5
  scale_max: 1.5

pieces:
  - piece_id: "early"
    skip: true
    local_period: 0.05937839
    local_epoch: 59866.380310805
    existing_template_dir: ../data/runs/R_TESS/pieces/early
    template_window:
      t_min: 59850.0
      t_max: 59861.5
    fit_window:
      t_min: 59850.0
      t_max: 59863
    intervals_path: ../data/R_TESS_early_intervals_max.dat
    # local_lc_path if omitted -- use global lc_path


  - piece_id: "parabolic"
    skip: false
    local_period: 0.05937839
    local_epoch: 59864.4936
    fold_ephemeris:
      kind: quadratic
      a: -2.014e-06
      b: 9.518e-04
      c: 0.03127
      # tau_period omitted → P(E_start) at template_window.t_min
      tau_period: 0.06
    template_window:
      t_min: 59865.3
      t_max: 59874.7
    fit_window:
      t_min: 59865.3
      t_max: 59874.7
    intervals_path: ../data/R_TESS_intervals_ordinary_max.dat

  - piece_id: "59874_77"
    skip: true
    local_period: 0.0600
    # existing_template_dir: ../data/runs/ground_R/pieces/59865
    template_window:
      t_min: 59874.5
      t_max: 59877.8
    fit_window:
      t_min: 59865.0
      t_max: 59865.7
    intervals_path: ../data/R_TESS_intervals_59874_77_max.dat

  - piece_id: "59877_79"
    skip: true
    local_period: 0.060
    # existing_template_dir: ../data/runs/ground_R/pieces/59865
    template_window:
      t_min: 59877.8
      t_max: 59879.0
    fit_window:
      t_min: 59877.8
      t_max: 59879.0
    intervals_path: ../data/R_TESS_intervals_59877_79_max.dat

